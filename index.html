<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSC Voice Scorer (Minor)</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.5rem; text-align: center; color: #ffcc00; margin-bottom: 10px; }
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        button {
            background-color: #ffcc00;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active { background-color: #e6b800; }
        button.secondary { background-color: #333; color: #fff; }
        input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-size: 1.1rem;
            box-sizing: border-box;
            margin-top: 5px;
        }
        .status {
            font-size: 0.9rem;
            color: #00ffcc;
            margin-top: 8px;
            text-align: center;
        }
        .flex { display: flex; gap: 10px; }
        .flex > * { flex: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: center; }
        th { background: #2a2a2a; color: #ffcc00; }
    </style>
</head>
<body>
    <h1>IPSC Voice Scorer (Minor)</h1>
    
    <!-- ステップ 1: タイム入力 -->
    <div id="step1" class="card">
        <h3>Step 1: タイム入力</h3>
        <label>タイム (秒):</label>
        <input type="number" id="timeInput" step="0.01" placeholder="例: 3.52">
        <button onclick="nextStep(2)">次へ (ターゲット入力へ)</button>
    </div>

    <!-- ステップ 2: ターゲット入力 -->
    <div id="step2" class="card" style="display:none;">
        <h3>Step 2: ターゲット確認・音声入力</h3>
        <p style="font-size:0.82rem; color:#aaa;">「アルファ」「チャーリー」「デルタ」「ミス」「ノーシュート」「プロシージャー」と発話してください。</p>
        
        <div class="flex">
            <button id="micBtn" onclick="toggleVoice()">🎙️ 音声認識: 停止中</button>
            <button class="secondary" onclick="resetScores()">リセット</button>
        </div>
        <div id="voiceStatus" class="status">マイクボタンを押して開始</div>

        <table>
            <tr><th>判定</th><th>点数/ペナルティ</th><th>回数</th></tr>
            <tr><td>A (Alpha)</td><td>5点</td><td id="countA">0</td></tr>
            <tr><td>C (Charlie)</td><td>3点</td><td id="countC">0</td></tr>
            <tr><td>D (Delta)</td><td>1点</td><td id="countD">0</td></tr>
            <tr><td>Miss</td><td>-10点</td><td id="countMiss">0</td></tr>
            <tr><td>No Shoot</td><td>-10点</td><td id="countNS">0</td></tr>
            <tr><td>Proc.</td><td>-10点</td><td id="countProc">0</td></tr>
        </table>

        <button style="margin-top:15px;" onclick="nextStep(3)">結果（ヒットファクター）を見る</button>
        <button class="secondary" onclick="nextStep(1)">戻る</button>
    </div>

    <!-- ステップ 3: 結果表示 -->
    <div id="step3" class="card" style="display:none;">
        <h3>Step 3: ヒットファクター算出</h3>
        <div style="font-size: 1.1rem; margin-bottom: 10px; line-height: 1.6;">
            <p>タイム: <span id="resTime">0.00</span> 秒</p>
            <p>合計ポイント: <span id="resPoints">0</span> 点</p>
            <p style="font-size: 1.4rem; color: #00ffcc; font-weight: bold;">HF: <span id="resHF">0.0000</span></p>
        </div>
        <button onclick="nextStep(2)">修正する</button>
        <button class="secondary" onclick="resetAll()">最初からやり直す</button>
    </div>

    <script>
        let currentStep = 1;
        let scores = { A: 0, C: 0, D: 0, Miss: 0, NS: 0, Proc: 0 };
        let runTime = 0.0;

        let recognition = null;
        let isListening = false;
        let shouldListen = false; // 自動再スタート制御フラグ

        function initSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("お使いのブラウザは音声認識に対応していません。Google Chromeをご利用ください。");
                return;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;
            recognition.continuous = true;

            recognition.onresult = (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                document.getElementById('voiceStatus').innerText = `認識: 「${transcript}」`;
                parseVoiceCommand(transcript);
            };

            recognition.onerror = (event) => {
                console.log("Speech recognition error", event.error);
            };

            recognition.onend = () => {
                // ユーザーが明動的に停止していない場合、自動的に音声認識を再起動する
                if (shouldListen) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log("Restart error:", e);
                    }
                } else {
                    isListening = false;
                    updateMicButton();
                }
            };
        }

        function toggleVoice() {
            if (!recognition) initSpeech();
            if (isListening) {
                shouldListen = false;
                recognition.stop();
                isListening = false;
            } else {
                shouldListen = true;
                try {
                    recognition.start();
                    isListening = true;
                } catch (e) {
                    console.log("Start error:", e);
                }
            }
            updateMicButton();
        }

        function updateMicButton() {
            const btn = document.getElementById('micBtn');
            const status = document.getElementById('voiceStatus');
            if (isListening) {
                btn.innerText = "⏹️ 音声認識: 稼働中 (自動継続)";
                btn.style.backgroundColor = "#ff4444";
                status.innerText = "聞き取り中... 話してください";
            } else {
                btn.innerText = "🎙️ 音声認識: 停止中";
                btn.style.backgroundColor = "#ffcc00";
                status.innerText = "マイクボタンを押して開始";
            }
        }

        function parseVoiceCommand(text) {
            if (text.includes('アルファ') || text.includes('A')) {
                scores.A++;
            } else if (text.includes('チャーリー') || text.includes('C')) {
                scores.C++;
            } else if (text.includes('デルタ') || text.includes('D')) {
                scores.D++;
            } else if (text.includes('ミス') || text.includes('MISS')) {
                scores.Miss++;
            } else if (text.includes('ノーシュート') || text.includes('NS')) {
                scores.NS++;
            } else if (text.includes('プロシージャー') || text.includes('手続き')) {
                scores.Proc++;
            }
            updateScoreDisplay();
        }

        function updateScoreDisplay() {
            document.getElementById('countA').innerText = scores.A;
            document.getElementById('countC').innerText = scores.C;
            document.getElementById('countD').innerText = scores.D;
            document.getElementById('countMiss').innerText = scores.Miss;
            document.getElementById('countNS').innerText = scores.NS;
            document.getElementById('countProc').innerText = scores.Proc;
        }

        function resetScores() {
            scores = { A: 0, C: 0, D: 0, Miss: 0, NS: 0, Proc: 0 };
            updateScoreDisplay();
        }

        function nextStep(step) {
            if (step === 2) {
                const t = parseFloat(document.getElementById('timeInput').value);
                if (isNaN(t) || t <= 0) {
                    alert("有効なタイムを入力してください。");
                    return;
                }
                runTime = t;
            }
            if (step === 3) {
                if (isListening) {
                    shouldListen = false;
                    recognition.stop();
                    isListening = false;
                    updateMicButton();
                }
                calculateResult();
            }

            document.getElementById('step1').style.display = (step === 1) ? 'block' : 'none';
            document.getElementById('step2').style.display = (step === 2) ? 'block' : 'none';
            document.getElementById('step3').style.display = (step === 3) ? 'block' : 'none';
            currentStep = step;
        }

        function calculateResult() {
            // マイナー計算: A=5, C=3, D=1, Miss=-10, NS=-10, Proc=-10
            let totalPoints = (scores.A * 5) + (scores.C * 3) + (scores.D * 1) - (scores.Miss * 10) - (scores.NS * 10) - (scores.Proc * 10);
            if (totalPoints < 0) totalPoints = 0;
            
            let hf = runTime > 0 ? (totalPoints / runTime) : 0;

            document.getElementById('resTime').innerText = runTime.toFixed(2);
            document.getElementById('resPoints').innerText = totalPoints;
            document.getElementById('resHF').innerText = hf.toFixed(4);
        }

        function resetAll() {
            resetScores();
            document.getElementById('timeInput').value = '';
            nextStep(1);
        }
    </script>
</body>
</html>
